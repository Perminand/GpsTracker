wialon:
  uri: "https://hosting.wln-hst.com/login.html?client_id=GpsTracker&access_type=-1&lang=ru"

spring:
  mvc:
    view:
      prefix: classpath:/templates/
      suffix: .html
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/users
    username: users
    password: users
  output:
    ansi:
      enabled: ALWAYS
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  sql:
    init:
      mode: always
  oauth2:
    client:
      preEstablishedRedirectUrl: /api/v1/apps/auth/login
